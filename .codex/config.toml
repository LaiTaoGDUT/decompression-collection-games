[mcp_servers.cocos-creator-stdio]
command = "node"
args = ["tools/cocos-mcp-platform-bridge.js"]
startup_timeout_sec = 20
tool_timeout_sec = 180
enabled = true

[mcp_servers.cocos-creator-stdio.env]
COCOS_MCP_HTTP_URL = "http://127.0.0.1:3001/mcp"

[mcp_servers.cocos-creator-stdio.tools.assetAdvanced_asset_system]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.assetAdvanced_asset_manage]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.debug_debug_console]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.project_project_manage]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.assetAdvanced_asset_query]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.assetAdvanced_asset_operations]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.scene_scene_management]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.scene_scene_query_system]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.scene_scene_hierarchy]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.node_node_lifecycle]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.node_node_transform]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.component_component_query]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.component_set_component_property]
approval_mode = "approve"

[mcp_servers.cocos-creator-stdio.tools.node_node_script_management]
approval_mode = "approve"
