services:
  db:
    image: postgres:17-bookworm
    restart: unless-stopped
    environment:
      POSTGRES_DB: decompression_api
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DB_ADMIN_PASSWORD:?Set DB_ADMIN_PASSWORD in .env}
      GAME_API_DB_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sh:/docker-entrypoint-initdb.d/10-decompression-api.sh:ro
    command: ["postgres", "-c", "shared_buffers=128MB", "-c", "max_connections=30", "-c", "log_min_duration_statement=1000"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d decompression_api"]
      interval: 5s
      timeout: 3s
      retries: 20
    mem_limit: 512m
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
  api:
    build: .
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://decompression_api:${DB_PASSWORD}@db:5432/decompression_api
      TOKEN_SECRET: ${TOKEN_SECRET:?Set TOKEN_SECRET in .env}
      WX_APP_ID: ${WX_APP_ID:-}
      WX_APP_SECRET: ${WX_APP_SECRET:-}
      TT_APP_ID: ${TT_APP_ID:-}
      TT_APP_SECRET: ${TT_APP_SECRET:-}
      HOST: 0.0.0.0
    depends_on:
      db: { condition: service_healthy }
    ports: ["127.0.0.1:3000:3000"]
    mem_limit: 320m
    init: true
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    logging: { driver: json-file, options: { max-size: "10m", max-file: "3" } }
volumes:
  postgres_data:
