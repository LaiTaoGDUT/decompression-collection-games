# 安装到 /etc/nginx/sites-available/decompression-api。
# 同一 api 域名下的其他游戏使用不同 location 和独立上游。
limit_req_zone $binary_remote_addr zone=decompression_api:10m rate=30r/s;

server {
    listen 80;
    server_name api.antcosmos.cn;
    client_max_body_size 64k;
    location /decompression/ {
        limit_req zone=decompression_api burst=60 nodelay;
        proxy_pass http://127.0.0.1:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 5s;
        proxy_read_timeout 15s;
    }
    location / { return 404; }
}
